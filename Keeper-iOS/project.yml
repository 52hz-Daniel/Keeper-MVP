# XcodeGen Project Specification
# Generate with: xcodegen generate

name: Keeper
options:
  bundleIdPrefix: com.keeper
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"

targets:
  Keeper:
    type: application
    platform: iOS
    sources:
      - Keeper
    settings:
      base:
        INFOPLIST_FILE: Keeper/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keeper.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        ENABLE_PREVIEWS: YES
    info:
      path: Keeper/Info.plist
      properties:
        CFBundleDisplayName: Keeper
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        CFBundleExecutable: $(EXECUTABLE_NAME)
        UILaunchScreen:
          UIColorName: midnightSlate
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: "Keeper uses your microphone to record voice logs for baby tracking."
        NSSpeechRecognitionUsageDescription: "Keeper uses speech recognition to convert your voice to text logs."
        
  KeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KeeperTests
    dependencies:
      - target: Keeper
    settings:
      base:
        INFOPLIST_FILE: KeeperTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.keeper.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Keeper.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Keeper

schemes:
  Keeper:
    build:
      targets:
        Keeper: all
        KeeperTests: [test]
    run:
      config: Debug
      environmentVariables:
        - variable: OPENAI_API_KEY
          value: ""
          isEnabled: false
    test:
      config: Debug
      targets:
        - KeeperTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

