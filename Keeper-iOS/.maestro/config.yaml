# Maestro Configuration for Keeper iOS
# Reference: Self-correcting workflow with MCP

# App configuration
appId: com.keeper.app
name: Keeper

# Test settings
retryCount: 2
screenshotOnFailure: true
continueOnFailure: false

# Timeouts
launchTimeout: 30000
waitTimeout: 10000

# Output
outputDir: .maestro/output

# Environment
env:
  API_KEY: ${OPENAI_API_KEY:-mock}

# Hooks
onFlowStart:
  - evalScript: |
      console.log('Starting Keeper test flow...')

onFlowComplete:
  - evalScript: |
      console.log('Test flow completed!')

